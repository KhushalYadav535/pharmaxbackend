services:
  influxdb:
    image: influxdb:1.8-alpine
    container_name: pharmax-k6-influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: pharmax-k6-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - influxdb
    restart: unless-stopped
